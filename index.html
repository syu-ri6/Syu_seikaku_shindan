<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>あんた何うさぎ？｜なんか遊んでたら性格バレるやつ</title>
<style>
:root{
  --bg:#fff7fb;
  --card:#ffffff;
  --ink:#26212a;
  --muted:#7b7282;
  --line:#eadce6;
  --accent:#ff7ab6;
  --accent2:#9f8cff;
  --good:#2bb673;
  --shadow:0 14px 36px rgba(73,45,68,.12);
}
*{box-sizing:border-box}
html,body{margin:0;background:linear-gradient(180deg,#fff7fb,#f8f6ff);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
button,input,textarea{font:inherit}
body{min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 48px}
.topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:3;padding:10px 0;background:linear-gradient(180deg,rgba(255,247,251,.96),rgba(255,247,251,.78),transparent)}
.brand{font-weight:900;font-size:15px}
.progress{flex:1;height:10px;background:#f0e7ef;border-radius:999px;overflow:hidden}
.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:.25s}
.count{font-size:12px;color:var(--muted);min-width:46px;text-align:right}
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);padding:24px 18px;min-height:560px;display:flex;flex-direction:column;justify-content:center}
h1{font-size:34px;line-height:1.12;margin:0 0 10px}
h2{font-size:28px;line-height:1.18;margin:0 0 12px}
.sub{color:var(--muted);line-height:1.7}
.small{font-size:12px;color:var(--muted)}
.micro{font-size:10px;color:#aaa0aa;text-align:center;margin:8px 0 0;line-height:1.45}
.linked-note{font-size:12px;line-height:1.65;color:#756b78;background:#faf6fb;border:1px dashed #dfd2dc;border-radius:14px;padding:10px 12px;margin:0 0 16px}
.linked-note strong{color:#4b424d}
.center{text-align:center}
.btn{border:none;border-radius:18px;padding:15px 18px;background:#25202a;color:white;font-weight:800;cursor:pointer;width:100%;margin-top:14px}
.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.accent{background:linear-gradient(90deg,var(--accent),var(--accent2))}
.big-red{width:180px;height:180px;border-radius:999px;background:#ff4f66;border:none;color:white;font-weight:900;font-size:28px;box-shadow:0 12px 0 #d73349,0 20px 35px rgba(255,79,102,.25);cursor:pointer;margin:20px auto}
.big-red:active{transform:translateY(6px);box-shadow:0 6px 0 #d73349}
.slider-wrap{padding:18px 2px}
.labels{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted);font-weight:700}
input[type=range]{width:100%;accent-color:var(--accent);margin:18px 0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.choice{border:1px solid var(--line);background:#fff;border-radius:18px;padding:16px 12px;min-height:66px;font-weight:800;cursor:pointer;text-align:center}
.choice.selected{outline:3px solid rgba(255,122,182,.28);border-color:var(--accent);background:#fff8fc}
.choice.large{min-height:92px;display:flex;align-items:center;justify-content:center}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.pill{padding:12px 14px;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer;font-weight:800}
.pill.selected{background:#fff0f7;border-color:#ffc3dc}
.float-cloud{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:20px}
.dragbox{border:2px dashed #d8cad4;border-radius:22px;min-height:110px;margin-top:18px;padding:14px}
.dragbox .hint{color:var(--muted);font-size:13px;text-align:center}
.room{position:relative;height:330px;border-radius:26px;background:#faf4f7;border:1px solid var(--line);overflow:hidden;margin-top:14px}
.seat{position:absolute;border:none;border-radius:20px;background:white;border:1px solid var(--line);padding:12px;cursor:pointer;font-weight:800}
.people{position:absolute;top:36px;left:50%;transform:translateX(-50%);font-size:38px}
.calendar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.timecard{border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center;background:#fff;cursor:pointer}
.timeline{border:2px dashed #d8cad4;border-radius:20px;padding:10px;min-height:220px;margin-top:12px}
.timeline .slot{padding:12px;background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.pathbox{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.path{min-height:220px;border-radius:24px;border:1px solid var(--line);padding:16px;display:flex;flex-direction:column;justify-content:flex-end;font-weight:900;cursor:pointer}
.path.safe{background:linear-gradient(#eef8ff,#fff)}
.path.unknown{background:linear-gradient(#eeeaff,#fff4fc)}
.input{width:100%;border:1px solid var(--line);border-radius:18px;padding:14px 16px;outline:none;margin-top:10px;background:#fff}
textarea.input{min-height:95px;resize:vertical}
.phone{border:12px solid #222;border-radius:34px;background:#fff;padding:22px 14px;margin:18px auto;max-width:320px}
.msg{background:#e9f1ff;border-radius:16px;padding:10px 12px;display:inline-block}
.face-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:16px}
.face{aspect-ratio:1;border:1px solid var(--line);background:#fff;border-radius:20px;font-size:32px;cursor:pointer}
.countdown{font-size:74px;font-weight:1000;text-align:center}
.sortable{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.sortitem{padding:14px;border:1px solid var(--line);border-radius:16px;background:white;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.sortitem button{border:none;background:#f5edf3;border-radius:10px;padding:6px 10px}
.result-head{text-align:center}
.rabbit{font-size:72px}
.type-title{font-size:32px;font-weight:1000;line-height:1.14}
.badge{display:inline-block;background:#fff0f7;border:1px solid #ffc6de;color:#a83b6d;border-radius:999px;padding:8px 12px;font-weight:900;margin:6px 4px}
.section{margin-top:28px;padding-top:22px;border-top:1px dashed var(--line)}
.checks{display:flex;flex-direction:column;gap:10px}
.check{background:#faf7fb;border-radius:16px;padding:12px 14px}
.quote{background:#fff8fc;border-left:5px solid var(--accent);padding:16px;border-radius:0 18px 18px 0;line-height:1.9}
.meterrow{display:grid;grid-template-columns:120px 1fr 40px;align-items:center;gap:8px;margin:9px 0;font-size:13px}
.meter{height:9px;background:#eee5ec;border-radius:999px;overflow:hidden}
.meter span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.relationship{background:linear-gradient(135deg,#fff1f8,#f0edff);border:1px solid #ead9ee;border-radius:24px;padding:18px;margin-top:14px}
.system{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#1d1b22;color:#f7f7fb;padding:18px;border-radius:20px;margin-top:14px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#222;color:#fff;padding:12px 16px;border-radius:999px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;z-index:10}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:520px){
  .card{min-height:calc(100vh - 95px);border-radius:22px;padding:22px 15px}
  h1{font-size:30px} h2{font-size:25px}
  .grid{grid-template-columns:1fr 1fr}
  .meterrow{grid-template-columns:96px 1fr 34px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar" id="topbar" style="display:none">
    <div class="brand">🐰 あんた何うさぎ？</div>
    <div class="progress"><div id="bar"></div></div>
    <div class="count" id="count"></div>
  </div>
  <main class="card" id="app"></main>
</div>
<div class="toast" id="toast"></div>

<script>
const app = document.getElementById('app');
const topbar = document.getElementById('topbar');
const bar = document.getElementById('bar');
const count = document.getElementById('count');
const toastEl = document.getElementById('toast');

const dims = ['E','O','C','A','N','AX','AV','BAS'];
const score = Object.fromEntries(dims.map(k=>[k,0]));
const weight = Object.fromEntries(dims.map(k=>[k,0]));
const extras = {
  intimacyGap:0,
  selfFreedom:null,
  behaviorFreedom:null,
  deliberationChange:0,
  stressShift:0,
  consistency:[],
  brag:'',
  selfOdd:'',
  seat:'',
  eyeEgg:'',
  scheduleCreated:0,
  conflictNormal:null,
  conflictClose:null,
  socialMood:null
};
let step = -1;

function add(axis,val,w=1){ score[axis]+=val*w; weight[axis]+=Math.abs(w); }
function toast(t){ toastEl.textContent=t; toastEl.classList.add('show'); setTimeout(()=>toastEl.classList.remove('show'),1300); }
function next(){ step++; render(); }
function updateProgress(){
  if(step<0 || step>=30){topbar.style.display='none';return;}
  topbar.style.display='flex';
  bar.style.width=((step)/30*100)+'%';
  count.textContent=(step+1)+'/30';
}
function normalize(axis){
  const w = weight[axis] || 1;
  const raw = score[axis]/w; // roughly -3..3
  return Math.max(0, Math.min(100, Math.round((raw+3)/6*100)));
}
function setHTML(h){ app.innerHTML=h; updateProgress(); window.scrollTo({top:0,behavior:'smooth'}); }
function btn(label,fn,cls='btn accent'){ const b=document.createElement('button'); b.className=cls; b.textContent=label; b.onclick=fn; return b; }

function intro(){
  setHTML(`
    <div class="center">
      <div class="rabbit">🐰</div>
      <h1>あんた何うさぎ？</h1>
      <p class="sub">なんか遊んでたら性格バレるやつ</p>
      <p style="line-height:1.9;margin-top:24px">ちょっとあなたのこと知りたいから遊んでって〜！<br>むずいことないよ。なんとなくでやって！</p>
      <p><strong>正解とかないし、最終的に勝手にうさぎにします。</strong></p>
      <p class="small">心理学・行動傾向を参考にした「性格傾向」の遊びです。医療・診断目的ではありません。</p>
      <button class="btn accent" onclick="step=0;render()">やるー！</button>
    </div>`);
}
function sliderScreen(title,left,right,onDone,initial=50,extra=''){
  setHTML(`<h2>${title}</h2>${extra}<div class="slider-wrap"><div class="labels"><span>${left}</span><span>${right}</span></div><input id="r" type="range" min="0" max="100" value="${initial}"></div><button id="ok" class="btn accent">これ！</button><p class="micro">※決めたら変更できないよ</p>`);
  const r=document.getElementById('r');
  let touched=false;
  ['input','change','touchstart','pointerdown'].forEach(ev=>r.addEventListener(ev,()=>{touched=true},{passive:true}));
  document.getElementById('ok').onclick=()=>{
    const v=+r.value;
    if(!touched){
      toast('動かさないんかい！wwww');
      setTimeout(()=>onDone(v),650);
    }else{
      onDone(v);
    }
  };
}
function multiSelectScreen(title,items,max,onDone,sub=''){
  setHTML(`<h2>${title}</h2><p class="sub">${sub}</p><div class="float-cloud" id="cloud">${items.map(x=>`<button class="pill" data-v="${x}">${x}</button>`).join('')}</div><button id="ok" class="btn accent" disabled>これで！</button>`);
  const selected=[];
  app.querySelectorAll('.pill').forEach(el=>el.onclick=()=>{
    const v=el.dataset.v;
    if(selected.includes(v)){selected.splice(selected.indexOf(v),1);el.classList.remove('selected')}
    else if(selected.length<max){selected.push(v);el.classList.add('selected')}
    document.getElementById('ok').disabled = selected.length!==max;
  });
  document.getElementById('ok').onclick=()=>onDone(selected);
}
function chooseScreen(title,choices,onDone,sub='',linked=''){
  setHTML(`<h2>${title}</h2>${linked?`<div class="linked-note">${linked}</div>`:''}<p class="sub">${sub}</p><div class="grid">${choices.map((c,i)=>`<button class="choice large" data-i="${i}">${c}</button>`).join('')}</div><p class="micro">※選んだら変更できないよ</p>`);
  app.querySelectorAll('.choice').forEach(el=>el.onclick=()=>onDone(+el.dataset.i));
}
function render(){
  if(step<0){ intro(); return; }
  if(step>=30){ showAnalysis(); return; }
  updateProgress();

  switch(step){
    case 0:
      setHTML(`<div class="center"><p class="small">01</p><h2>絶対押すな</h2><p class="sub">ほんとに。</p><button class="big-red" id="red">押すな</button><button class="btn secondary" id="skip">次いく</button></div>`);
      document.getElementById('red').onclick=()=>{add('O',2);add('BAS',2);add('C',-.5);toast('押すんかいwwwwww');setTimeout(next,700)};
      document.getElementById('skip').onclick=()=>{add('C',1);add('BAS',-.5);toast('ちゃんと言うこと聞くじゃん');setTimeout(next,700)};
      break;

    case 1:
      sliderScreen('今日、人間と会える？','人間むり','人間こい！！！',v=>{
        extras.socialMood=v; add('E',(v-50)/20); add('N',(50-v)/80); toast(v>70?'元気だね〜〜〜！':'なるほどね〜〜〜👀'); next();
      });
      break;

    case 2:
      multiSelectScreen('はい突然ですが','自由,安心,愛,お金,刺激,時間,仲間,睡眠'.split(','),3,sel=>{
        sel.forEach(v=>{
          if(v==='自由'){add('O',1.5);add('AV',.5)}
          if(v==='安心'){add('C',1);add('N',.5)}
          if(v==='愛'){add('A',1.5);add('AX',1)}
          if(v==='お金'){add('C',.7)}
          if(v==='刺激'){add('O',1.5);add('BAS',1.5)}
          if(v==='時間'){add('AV',.7);add('C',.5)}
          if(v==='仲間'){add('E',1.2);add('A',1)}
          if(v==='睡眠'){add('N',-.4);add('C',.3)}
        }); toast('それ持ってくんだww'); next();
      },'この中から3つだけ持ってっていいよ');
      break;

    case 3:
      setHTML(`<h2>知らん人たちの部屋に放り込まれました</h2><p class="sub">好きなとこ座って</p>
      <div class="room">
        <div class="people">🧑‍🤝‍🧑</div>
        <button class="seat" data-s="near" style="left:38%;top:105px">人の隣</button>
        <button class="seat" data-s="window" style="right:18px;top:110px">窓際</button>
        <button class="seat" data-s="floor" style="left:18px;bottom:30px">床</button>
        <button class="seat" data-s="far" style="right:30px;bottom:30px">離れた椅子</button>
        <button class="seat" data-s="middle" style="left:42%;bottom:40px">真ん中</button>
      </div><p class="micro">※座る場所を選んだら変更できないよ</p>`);
      app.querySelectorAll('.seat').forEach(el=>el.onclick=()=>{
        const s=el.dataset.s; extras.seat=s;
        if(s==='near'){add('E',2);add('AV',-1)}
        if(s==='middle'){add('E',1);add('AV',-.5)}
        if(s==='window'){add('O',.5);add('AV',1)}
        if(s==='floor'){add('O',.7);add('E',-.3)}
        if(s==='far'){add('E',-1.5);add('AV',2)}
        toast('そこなんだwwww'); next();
      });
      break;

    case 4:
      sliderScreen('今日の予定、全部なくなりました。','😭','🎉',v=>{
        add('C',(50-v)/20); add('E',(50-v)/70); add('N',(50-v)/90); add('BAS',(v-50)/80);
        extras.consistency.push({k:'scheduleFreedom',v}); toast('顔wwwwww'); next();
      },50,'<p class="sub">急に。全部。</p>');
      break;

    case 5:
      multiSelectScreen('このへんまでなら貸せる','充電器,服,イヤホン,1000円,スマホ本体,家の鍵'.split(','),3,sel=>{
        const intimacy = sel.length;
        add('A',1); add('AV', sel.includes('家の鍵')?-2:1);
        if(sel.includes('スマホ本体')) add('AV',-1);
        if(sel.includes('1000円')) add('A',1);
        toast('境界線そこね〜'); next();
      },'「まあ貸せるかな」ってやつを3つ');
      break;

    case 6:
      chooseScreen('ごめん、一個だけ没収します',['自由','安心','愛情','刺激'],i=>{
        const x=['自由','安心','愛情','刺激'][i];
        if(x==='自由'){add('O',-1);add('C',1)}
        if(x==='安心'){add('N',-1);add('BAS',1)}
        if(x==='愛情'){add('A',-1);add('AV',1)}
        if(x==='刺激'){add('O',-1);add('BAS',-1)}
        toast('それ捨てるんだ！！！'); next();
      },'いらんやつ、ひとつ。');
      break;

    case 7:
      sliderScreen('「ちょっと話したい」って来た','今聞く','ちょい待って',v=>{
        add('E',(50-v)/30); add('A',(50-v)/35); add('AV',(v-50)/25); toast('ほーん'); next();
      });
      break;

    case 8:
      sliderScreen('「今日なんか変じゃない？」って言われた','別に？','え、どこが！？',v=>{
        add('N',(v-50)/20); add('AX',(v-50)/35); toast(v>70?'気になるよなww':'強いwwww'); next();
      });
      break;

    case 9:
      setHTML(`<h2>帰るだけです。どっち行く？</h2><div class="pathbox">
        <button class="path safe" id="safe"><span>いつもの道</span></button>
        <button class="path unknown" id="unknown"><span>なんか知らん道 ✨</span></button>
      </div><p class="micro">※道を選んだら変更できないよ</p>`);
      document.getElementById('safe').onclick=()=>{add('O',-1.5);add('C',.5);toast('今日は帰ろ帰ろ');next()};
      document.getElementById('unknown').onclick=()=>{add('O',2);add('BAS',1.5);toast('絶対なんかあるもんね！！');next()};
      break;

    case 10:
      setHTML(`<h2>はい、自慢して</h2><p class="sub">20文字まで！なんでもいい！！！<br>「足速い」とかでもいい！！！</p><input class="input" maxlength="20" id="brag" placeholder="ここに自慢"><button class="btn accent" id="ok">言った！</button>`);
      document.getElementById('ok').onclick=()=>{extras.brag=document.getElementById('brag').value.trim();toast('いいじゃーん！！！！もっと自慢して生きろー！！！');setTimeout(next,800)};
      break;

    case 11:
      sliderScreen('あんた今日めっちゃいいじゃん！！！','そうでしょ？','いやいやいや',v=>{
        add('N',(v-50)/35); add('E',(50-v)/50); toast('褒められた時くらい受け取っとけー！！！ww'); next();
      },45,'<p class="sub">なんか知らんけど！！！</p>');
      break;

    case 12:
      setHTML(`<h2>既読。</h2><div class="phone"><div class="msg">今日どうするー？</div><p class="small">既読 18:42</p><p style="font-weight:900;margin-top:36px">現在 20:17</p></div><button class="btn accent" id="go">で？</button>`);
      document.getElementById('go').onclick=()=>sliderScreen('気になる？','全然','めっちゃ',v=>{add('AX',(v-50)/16);add('N',(v-50)/40);toast(v>65?'気になるよね〜':'全然いけるタイプね');next();});
      break;

    case 13:
      multiSelectScreen('普通の人にはイヤだけど','急な電話,返信遅い,服を借りる,突然会いに来る,長電話,家に来る,予定変更,甘えてくる'.split(','),3,sel=>{
        extras.intimacyGap += sel.length;
        add('A',1); add('AX',1.2); add('AV',-1);
        toast('はいはい特別扱いね〜〜〜ww'); next();
      },'好きな人なら「まあいいかも」ってやつを3つ');
      break;

    case 14:
      setHTML(`<h2>明日の予定、好きに作って</h2><p class="sub">押した順に入るよ。もういいと思ったら終わり。</p>
      <div class="grid" id="cards">${['起きる','ごはん','仕事/学校','遊ぶ','休む','風呂','寝る'].map(x=>`<button class="choice" data-v="${x}">${x}</button>`).join('')}</div>
      <div class="timeline" id="tl"><div class="small">ここに予定が入ります</div></div><p class="micro">※予定を押したら追加されるよ。追加したものは変更できないよ</p><button class="btn secondary" id="done">もういい</button>`);
      const arr=[];
      const scheduleComment=(added)=>{
        const i=arr.length-1;
        const has=(x)=>arr.includes(x);
        const pos=(x)=>arr.indexOf(x);
        if(i===0 && added==='寝る') return '初手寝るんかいwwww';
        if(i===0 && added==='風呂') return '起きてないのに風呂から始まるんだwwww';
        if(i===0 && added==='仕事/学校') return '起きる前に出勤してる！？wwww';
        if(i===0 && added==='ごはん') return 'まず食べるんだwwww 起きてる！？';
        if(added==='起きる' && i>0) return 'ここで起きるんかいwwww';
        if(has('寝る') && added!=='寝る' && pos('寝る')<i) return '寝たあとまだ予定あるんかいwwww';
        if(added==='寝る' && !has('起きる')) return 'まだ起きてないのに寝るのねwwww';
        if(added==='風呂' && has('寝る') && pos('寝る')<i) return '寝たあと風呂入るんかいwwww';
        if(added==='仕事/学校' && !has('起きる')) return '起床なしで仕事/学校いくの強すぎwwww';

function closeness(r,vals){
  let total=0, ws=0;
  for(const k of dims){
    const w=r.w[k]||0.35;
    total += Math.abs(vals[k]-r.p[k])*w;
    ws += 100*w;
  }
  // extras as discriminators
  if(r.id==='special') total -= Math.min(extras.intimacyGap*1.5,12);
  if(r.id==='close'){ total -= Math.min(extras.intimacyGap*2.2,18); if(vals.AX>70)total-=7; if(vals.AV<35)total-=7; }
  if(r.id==='schedule' && extras.selfFreedom!==null && extras.behaviorFreedom!==null){
    const selfC=100-extras.selfFreedom, behC=100-extras.behaviorFreedom;
    if(selfC>55 && behC<55) total-=15;
  }
  if(r.id==='overthink') total -= Math.min(extras.deliberationChange*4 + extras.stressShift*2,18);
  if(r.id==='noisy' && extras.seat==='far' && vals.E>55) total-=8;
  return Math.max(0,1-total/ws);
}
function specialBadges(vals){
  const out=[];
  if(extras.selfFreedom!==null && extras.behaviorFreedom!==null){
    if(extras.selfFreedom-extras.behaviorFreedom>30) out.push({t:'自由人名乗り',d:'自分ではかなり自由人寄り。でも実際の選択は思ったより安心を取りにいってましたwwww　安全基地付き自由人、普通に強いよ。'});
    if(extras.behaviorFreedom-extras.selfFreedom>35) out.push({t:'意外と飛ぶ',d:'自分ではそこまで自由人だと思ってないのに、行動では結構そっち行くじゃんwwww　本人が思ってるより冒険する人でした。'});
  }
  if(vals.E>62 && extras.socialMood<45) out.push({t:'人見知り名乗り',d:'人が嫌いというより、起動に時間がかかるタイプかも。安心した後は普通に人間好きじゃんwwww'});
  if(vals.N>72 && vals.O>68) out.push({t:'脳内営業中',d:'外から静かでも中はめっちゃ動いてますwwww　考えられる力、ちゃんとあるよ。'});
  if(extras.deliberationChange>=2) out.push({t:'考えたら変わる',d:'直感の答えと、ゆっくり考えた答えが違いました。最初の勢いも、考え直す力も両方あるタイプ。'});
  return out.slice(0,2);
}
function userSpecificChecks(main,hidden,vals){
  const all=[...main.checks.slice(0,3)];
  if(hidden) all.push(hidden.checks[0]);
  if(vals.E<35) all.push('一人の時間、普通に必要');
  if(vals.E>70) all.push('喋り始めると結構元気になる');
  if(vals.O>78) all.push('知らないものへの「なにそれ？」が強め');
  if(vals.C<38) all.push('準備より先に始める時がある');
  if(vals.C>70) all.push('見通しがあるとかなり安心する');
  if(vals.A>78) all.push('人のこと、思ってる以上にちゃんと見てる');
  if(vals.N>75) all.push('納得できるまで頭の中で処理しがち');
  if(vals.AX>75) all.push('大事な人のことになると気になる量が増える');
  if(vals.AV>72) all.push('近すぎると一人時間を取りたくなる');
  if(vals.BAS>80) all.push('面白そうへの反応だけ異様に速い');
  return [...new Set(all)].slice(0,6);
}
